# Seedit Archive — Seedit archiver API + crawler (a Bitsocial Forge product).
#
# Runs only the `server` half of the public `bitsocial-indexer` engine, pulled
# as a pinned image from GHCR — no engine code lives in this repo and nothing
# is built here. To upgrade, bump the `image:` tag below to the engine release
# you want, then `docker compose pull && docker compose up -d` (see DEPLOY.md).
# The web UI is a separate Vercel deployment of the engine's `webui/` (see
# DEPLOY.md).
#
# Networking: the container shares the host's network so the crawler can reach
# the bitsocial-cli daemon on ws://localhost:9138 (the daemon binds to host
# loopback). HOST=127.0.0.1 keeps the API itself loopback-only — the host's
# Caddy terminates TLS for api.seeditarchive.org and proxies to :4002.
services:
  server:
    # Pinned engine release, published by the engine's own CI
    # (.github/workflows/docker.yml). The package is public — no registry login.
    image: ghcr.io/bitsocialnet/bitsocial-indexer:v0.4.1
    network_mode: host
    environment:
      # Bind: loopback only; Caddy is the public face.
      HOST: 127.0.0.1
      PORT: 4002
      # Cap the V8 heap (defaults let it balloon to ~4 GiB; box has OOM-killed
      # before). This instance starts with 10 Seedit communities; raise only
      # after checking container memory and crawler logs.
      NODE_OPTIONS: "--max-old-space-size=512"
      SITE_NAME: Seedit Archive
      SITE_URL: ${SITE_URL:-https://seeditarchive.org}
      # The co-located bitsocial-cli daemon's local-only PKC RPC endpoint.
      PKC_RPC_URL: ${PKC_RPC_URL}
      # Index only official Seedit discovery/default communities (generated by
      # scripts/build-communities.mjs).
      COMMUNITIES_SOURCE: /config/communities.json
      # Takedown blocklist (see README "Takedowns / content policy"). The engine
      # watches this file — edits apply within ~a minute, no restart needed.
      BLOCKLIST_SOURCE: /config/blocklist.json
      # Directory SFW verdicts by directory code (Seedit's directories-defaults
      # list), and the operator overrides that correct them. The engine watches
      # the overrides file like the blocklist — no restart needed.
      DIRECTORY_DEFAULTS_SOURCE: ${DIRECTORY_DEFAULTS_SOURCE:-}
      NSFW_OVERRIDES_SOURCE: ${NSFW_OVERRIDES_SOURCE:-}
      DB_PATH: /data/seeditarchive.db
      # Keep every community close to live. The engine enforces a bounded worker
      # pool, skips overlapping scheduler passes, and resets timed-out RPC work.
      CRAWL_INTERVAL_MS: ${CRAWL_INTERVAL_MS:-5000}
      CRAWL_CONCURRENCY: ${CRAWL_CONCURRENCY:-8}
      CRAWL_TIMEOUT_MS: ${CRAWL_TIMEOUT_MS:-30000}
      CRAWL_MAX_PAGES: ${CRAWL_MAX_PAGES:-20}
      # CORS: the Vercel-hosted web UI plus production and local Seedit search
      # call the API from a browser. Keep both Seedit origins here, and never set
      # this to `*`: the engine already falls back to `*` when this is unset, so
      # an open API is the failure mode of a missing value, not an opt-in.
      # ALLOWED_ORIGINS is the engine's new env name; CORS_ORIGIN is the legacy
      # name it still honours — set both so this works across engine versions.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://seeditarchive.org,https://seedit.app,https://seedit.localhost}
      CORS_ORIGIN: ${ALLOWED_ORIGINS:-https://seeditarchive.org,https://seedit.app,https://seedit.localhost}
    volumes:
      - ./config:/config:ro
      - data:/data
    restart: unless-stopped
    # Hard backstop above the heap cap (native/buffer memory included).
    mem_limit: 1g

volumes:
  data:
